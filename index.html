      <p><span data-lang="developed">Developed by</span> <a target="_blank" href="https://facebook.com/bimboboy1">mohamed alsariti</a></p>

  <div id="socialModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tooltipster/4.2.8/js/tooltipster.bundle.min.js"></script>

  <script>
      const translations = {
        en: {
          name: 'GhNewa',
          bio: 'Content Creator - Streamer',
          'kick-tooltip': 'Watch my live streams on Kick',
          'facebook-tooltip': 'View my Facebook links',
          'instagram-tooltip': 'View my Instagram links',
          'tiktok-tooltip': 'View my TikTok links',
          'whatsapp-tooltip': 'Join my WhatsApp community',
          'youtube-tooltip': 'Subscribe to my YouTube channel',
          'discord-tooltip': 'Join my Discord server',
          rights: 'All rights reserved',
          developed: 'Developed by',
          'facebook-title': 'Facebook Links',
          'instagram-title': 'Instagram Links',
          'tiktok-title': 'TikTok Links',
          'facebook-account': 'Facebook Account',
          'facebook-channel': 'Facebook Channel',
          'facebook-group': 'Facebook Group',
          'facebook-page': 'Facebook Page',
          'instagram-account': 'Instagram Account',
          'instagram-channel': 'Instagram Channel',
          'tiktok-account': 'TikTok Account',
          'tiktok-channel': 'TikTok Channel'
        },
        ar: {
          name: '\u063A\u0646\u064A\u0648\u0629',
          bio: '\u0635\u0627\u0646\u0639 \u0645\u062D\u062A\u0648\u0649 - \u0633\u062A\u0631\u064A\u0645\u0631',
          'kick-tooltip': '\u0634\u0627\u0647\u062F \u0628\u062B\u0648\u062B\u064A \u0627\u0644\u0645\u0628\u0627\u0634\u0631\u0629 \u0639\u0644\u0649 \u0643\u064A\u0643',
          'facebook-tooltip': '\u0639\u0631\u0636 \u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'instagram-tooltip': '\u0639\u0631\u0636 \u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u0625\u0646\u0633\u062A\u062C\u0631\u0627\u0645',
          'tiktok-tooltip': '\u0639\u0631\u0636 \u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u062A\u064A\u0643 \u062A\u0648\u0643',
          'whatsapp-tooltip': '\u0627\u0646\u0636\u0645 \u0625\u0644\u0649 \u0645\u062C\u062A\u0645\u0639 \u0627\u0644\u0648\u0627\u062A\u0633\u0627\u0628',
          'youtube-tooltip': '\u0627\u0634\u062A\u0631\u0643 \u0641\u064A \u0642\u0646\u0627\u0629 \u0627\u0644\u064A\u0648\u062A\u064A\u0648\u0628',
          'discord-tooltip': '\u0627\u0646\u0636\u0645 \u0625\u0644\u0649 \u0633\u064A\u0631\u0641\u0631 \u0627\u0644\u062F\u064A\u0633\u0643\u0648\u0631\u062F',
          rights: '\u062C\u0645\u064A\u0639 \u0627\u0644\u062D\u0642\u0648\u0642 \u0645\u062D\u0641\u0648\u0638\u0629',
          developed: '\u062A\u0645 \u0627\u0644\u062A\u0637\u0648\u064A\u0631 \u0628\u0648\u0627\u0633\u0637\u0629',
          'facebook-title': '\u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'instagram-title': '\u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u0625\u0646\u0633\u062A\u062C\u0631\u0627\u0645',
          'tiktok-title': '\u0631\u0648\u0627\u0628\u0637 \u0627\u0644\u062A\u064A\u0643 \u062A\u0648\u0643',
          'facebook-account': '\u062D\u0633\u0627\u0628 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'facebook-channel': '\u0642\u0646\u0627\u0629 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'facebook-group': '\u0645\u062C\u0645\u0648\u0639\u0629 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'facebook-page': '\u0635\u0641\u062D\u0629 \u0627\u0644\u0641\u064A\u0633\u0628\u0648\u0643',
          'instagram-account': '\u062D\u0633\u0627\u0628 \u0627\u0644\u0625\u0646\u0633\u062A\u062C\u0631\u0627\u0645',
          'instagram-channel': '\u0642\u0646\u0627\u0629 \u0627\u0644\u0625\u0646\u0633\u062A\u062C\u0631\u0627\u0645',
          'tiktok-account': '\u062D\u0633\u0627\u0628 \u0627\u0644\u062A\u064A\u0643 \u062A\u0648\u0643',
          'tiktok-channel': '\u0642\u0646\u0627\u0629 \u0627\u0644\u062A\u064A\u0643 \u062A\u0648\u0643'
        }
      };

      let currentLang = localStorage.getItem('language') || 'en';

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('language', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const langToggle = document.getElementById('toggle-language');
        if (lang === 'ar') {
          langToggle.classList.add('active');
        } else {
          langToggle.classList.remove('active');
        }

        document.querySelectorAll('[data-lang]').forEach(elem => {
          const key = elem.getAttribute('data-lang');
          if (translations[lang][key]) {
            elem.textContent = translations[lang][key];
          }
        });

        document.querySelectorAll('[data-lang-title]').forEach(elem => {
          const key = elem.getAttribute('data-lang-title');
          if (translations[lang][key]) {
            if ($(elem).hasClass('tooltipstered')) {
              $(elem).tooltipster('destroy');
            }
            elem.setAttribute('title', translations[lang][key]);
          }
        });
      }

      document.getElementById('toggle-language').addEventListener('click', () => {
        const newLang = currentLang === 'en' ? 'ar' : 'en';
        setLanguage(newLang);
      });

      setLanguage(currentLang);

      $('body').on('mouseenter', '*[title]', function() {
        $(this).tooltipster({
          animation: 'grow',
          animationDuration: 300,
          delay: 100,
          speed: 350,
          theme: 'tooltipster-punk',
          contentAsHTML: true,
          interactive: true,
          debug: false,
          maxWidth: 500
        }).tooltipster('show');
      });

      document.getElementById('year').textContent = new Date().getFullYear();

      function openModal(platform) {
      const modal = document.getElementById('socialModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalButtons = document.getElementById('modalButtons');

      if (platform === 'facebook') {
        modalTitle.innerHTML = `<i class="fab fa-facebook"></i> ${translations[currentLang]['facebook-title']}`;
        modalButtons.innerHTML = `
          <a href="https://www.facebook.com/ahmed.abd.elghany.157474/" target="_blank" class="modal-btn facebook-btn">
            <i class="fas fa-user"></i>
            <span>${translations[currentLang]['facebook-account']}</span>
          </a>
          <a href="https://www.messenger.com/channel/GhNewa" target="_blank" class="modal-btn facebook-btn">
            <i class="fas fa-users"></i>
            <span>${translations[currentLang]['facebook-channel']}</span>
          </a>
          <a href="https://www.facebook.com/groups/2262410660525987" target="_blank" class="modal-btn facebook-btn">
            <i class="fas fa-user-group"></i>
            <span>${translations[currentLang]['facebook-group']}</span>
          </a>
          <a href="https://www.facebook.com/GhNewa/" target="_blank" class="modal-btn facebook-btn">
            <i class="fas fa-pager"></i>
            <span>${translations[currentLang]['facebook-page']}</span>
          </a>
        `;
      } else if (platform === 'instagram') {
        modalTitle.innerHTML = `<i class="fab fa-instagram"></i> ${translations[currentLang]['instagram-title']}`;
        modalButtons.innerHTML = `
          <a href="https://www.instagram.com/ghnewa_/" target="_blank" class="modal-btn instagram-btn">
            <i class="fas fa-user"></i>
            <span>${translations[currentLang]['instagram-account']}</span>
          </a>
          <a href="https://www.instagram.com/channel/AbYjN1RWsprTqMNj/?igsh=dWkxOHpqNDE5NHZr" target="_blank" class="modal-btn instagram-btn">
            <i class="fas fa-users"></i>
            <span>${translations[currentLang]['instagram-channel']}</span>
          </a>
        `;
      } else if (platform === 'tiktok') {
        modalTitle.innerHTML = `<i class="fab fa-tiktok"></i> ${translations[currentLang]['tiktok-title']}`;
        modalButtons.innerHTML = `
          <a href="https://www.tiktok.com/@ghnewa" target="_blank" class="modal-btn tiktok-btn">
            <i class="fas fa-user"></i>
            <span>${translations[currentLang]['tiktok-account']}</span>
          </a>
          <a href="https://vt.tiktok.com/ZSHcf5pWPYbaN-0bGos/" target="_blank" class="modal-btn tiktok-btn">
            <i class="fas fa-users"></i>
            <span>${translations[currentLang]['tiktok-channel']}</span>
          </a>
        `;
      }

      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('show'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('socialModal');
      modal.classList.remove('show');
      setTimeout(() => modal.style.display = 'none', 300);
    }

    window.onclick = function(event) {
      const modal = document.getElementById('socialModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
